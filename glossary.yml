# ASR term corrections applied to transcripts before they reach the model.
#
# Format:  Correct Term: [list, of, misheard, variants]
# Matching is case-insensitive, on whole words/phrases only. Longer variants
# are tried first so "Lang graph" wins over any shorter overlapping rule.
#
# SAFETY RULE: never add a variant that is also an ordinary English word in
# this domain. "Face"/"Phase" -> FAISS looks tempting and would corrupt every
# legitimate use of those words. When in doubt, leave it to the model, which
# is told to repair residual ASR noise from context.
#
# Add a course-specific file and pass --glossary to override or extend this.

