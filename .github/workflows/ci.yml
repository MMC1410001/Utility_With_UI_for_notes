name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # tests_mdparse imports diagrams -> generate -> glossary -> yaml, so the
      # suite needs the core dependencies even though it touches no network.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[web]"
      - name: unit tests
        run: python tests.py
      - name: legacy markdown tests
        run: python tests_mdparse.py
      - name: imports and CLI surface
        run: |
          python -c "import notesgen.cli, notesgen.pipeline, notesgen.server.app"
          python -m notesgen --help
          python -m notesgen setup --dry-run
      - name: byte-compile everything
        run: python -m compileall -q notesgen

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: syntax-check the extension
        run: |
          for f in extension/*.js extension/lib/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('extension/manifest.json'))"
