[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notesgen"
version = "0.2.0"
description = "Turn Udemy course transcripts into revision notes: Markdown, HTML, Word, PDF and Google Docs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["udemy", "transcripts", "notes", "summarisation", "llm"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["pyyaml", "python-docx"]

[project.optional-dependencies]
web   = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
udemy = ["playwright"]
gdocs = ["google-api-python-client", "google-auth-oauthlib", "google-auth-httplib2", "httplib2"]
api   = ["anthropic", "openai", "google-genai"]
all   = ["notesgen[web,udemy,gdocs,api]"]

[project.scripts]
notesgen = "notesgen.cli:main"

[tool.setuptools]
packages = ["notesgen", "notesgen.providers", "notesgen.server"]

[tool.setuptools.package-data]
"notesgen.server" = ["static/*"]
